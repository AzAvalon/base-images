name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    uses: AzAvalon/workflows/.github/workflows/_pre_commit.yml@e78a19badbb56ee16d21e47f3f8cdec81410d8e8 # 0.1.2
    permissions:
      contents: read
    with:
      github-client-id: ${{ vars.CI_APP_CLIENT_ID }}
    secrets:
      github-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
