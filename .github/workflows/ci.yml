name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    uses: AzAvalon/workflows/.github/workflows/_pre_commit.yml@3480b6c8aefcb3d83ef93c72c717c691a44c16f6 # 0.1.1
    permissions:
      contents: read
    with:
      github-client-id: ${{ vars.CI_APP_CLIENT_ID }}
    secrets:
      github-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
