name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    uses: AzAvalon/workflows/.github/workflows/_pre_commit.yml@0bd1a4aaab30979b0e45b4a2340674575ea4cc90 # 0.1.0
    permissions:
      contents: read
    with:
      github-client-id: ${{ vars.CI_APP_CLIENT_ID }}
    secrets:
      github-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
